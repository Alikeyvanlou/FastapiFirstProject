[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".venv",
    "venv",
    ".env",
    "env",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "migration",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "ASYNC",
    "S",
    "PTH",
    "SIM",
    "RUF",
]

ignore = [
    "ANN101",
    "ANN102",
    "B008",
    "S101",
    "E501"
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"